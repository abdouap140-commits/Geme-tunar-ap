name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Create web assets if missing
        run: |
          if [ ! -d "www" ]; then
            mkdir www
            echo '<html><body><h1>Game Tuner App</h1></body></html>' > www/index.html
          fi
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.gametuner.app","appName":"Game Tuner","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          fi

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-tuner-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
